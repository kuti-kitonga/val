<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Knew You'd Say Yes! 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== YES PAGE SPECIFIC STYLES ===== */
        body {
            background: linear-gradient(135deg, #ff9e9e, #ffb6c1, #ff6b6b);
            justify-content: center;
            align-items: center;
        }
        
        .yes-container {
            text-align: center;
            animation: popIn 0.6s ease-out;
            position: relative;
            z-index: 10;
        }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        #yes-message {
            color: #ff1493;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(255, 20, 147, 0.5);
            font-weight: 800;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* ===== KOALA STYLES ===== */
        #koala-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            opacity: 0;
            transform: scale(0.5) translateY(-20px);
            transition: all 1s ease-out;
        }
        
        .koala {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            animation: koalaFloat 3s ease-in-out infinite;
        }
        
        @keyframes koalaFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes koalaShake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-5px) rotate(-3deg); }
            75% { transform: translateX(5px) rotate(3deg); }
        }
        
        #koala-text {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            font-weight: 800;
            color: #ff1493;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }
        
        /* ===== PINK ENVELOPE STYLES ===== */
        #envelope-container {
            position: relative;
            width: 220px;
            height: 160px;
            margin: 20px auto;
        }
        
        #envelope {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: bottom;
            animation: envelopeOpen 1s ease-out forwards;
        }
        
        @keyframes envelopeOpen {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-180deg); }
        }
        
        .envelope-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 110px;
            background: #ff69b4; /* Hot pink */
            border-radius: 12px 12px 0 0;
            box-shadow: 0 6px 20px rgba(255, 105, 180, 0.5);
            z-index: 1;
            border: 4px solid #fff;
        }
        
        .envelope-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 110px;
            background: #ff1493; /* Deep pink */
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            transform-origin: top;
            box-shadow: inset 0 -8px 15px rgba(0, 0, 0, 0.2);
            z-index: 2;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }
        
        .envelope-seal {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            z-index: 3;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            animation: sealFloat 2s ease-in-out infinite;
        }
        
        @keyframes sealFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
        
        /* ===== HEARTS SPILL ===== */
        #hearts-spill-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 15;
        }
        
        .heart-spill {
            position: absolute;
            font-size: 20px;
            animation: heartFall 3s ease-out forwards;
            opacity: 0;
            z-index: 16;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3));
        }
        
        @keyframes heartFall {
            0% {
                transform: translate(0, -80px) rotate(0deg) scale(0.2);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) rotate(var(--rotate)) scale(1);
                opacity: 0.9;
            }
        }
        
        .heart-spill:nth-child(5n+1) { color: #ff1493; }
        .heart-spill:nth-child(5n+2) { color: #ff69b4; }
        .heart-spill:nth-child(5n+3) { color: #ff4d8d; }
        .heart-spill:nth-child(5n+4) { color: #ff85a0; }
        .heart-spill:nth-child(5n+5) { color: #ff3366; }
        
        /* Responsive */
        @media (max-width: 768px) {
            #yes-message { font-size: 1.8rem; }
            #envelope-container { width: 180px; height: 130px; }
            .koala { width: 90px; height: 90px; }
            #koala-text { font-size: 1rem; bottom: -25px; }
        }
    </style>
</head>
<body>
    <div class="hearts-bg"></div>
    
    <div class="yes-container">
        <h2 id="yes-message">I knew you'd say yes! 💕</h2>
        
        <div id="koala-container">
            <img id="koala-img" src="https://i.imgur.com/7QeQx9l.png" alt="overwhelmed koala" class="koala">
            <div id="koala-text">you</div>
        </div>
        
        <div id="envelope-container">
            <div id="envelope">
                <div class="envelope-flap"></div>
                <div class="envelope-body"></div>
                <div class="envelope-seal">💌</div>
            </div>
        </div>
        
        <div id="hearts-spill-container"></div>
    </div>

    <script src="yes-script.js"></script>
</body>
</html>
