<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Bunch, Will you be my Valentine? 💕🥹</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hearts-bg"></div>

    <div class="container">
        <h1>Honey Bunch, will you be my Valentine? 💕🥹</h1>
        <div class="gif-container">
            <!-- SAFE DIRECT GIF LINK (no spaces/apostrophes) -->
            <img id="cat-gif" src="https://media.tenor.com/8vFSJ6dD5-AAAAAC/valentines-day-heart.gif" alt="cute valentine character">
        </div>

        <div class="buttons">
            <button id="yes-btn" onclick="handleYesClick()">Yes</button>
            <button id="no-btn" onclick="handleNoClick()">No</button>
        </div>
        <div id="tease-toast"></div>
    </div>

    <!-- Background Music (using assets folder) -->
    <audio id="bg-music" loop autoplay muted>
        <source src="assets/song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <button id="music-toggle" onclick="toggleMusic()" title="Toggle music">🔊</button>

    <!-- YES RESPONSE MODAL (hidden by default) -->
    <div id="yes-modal" class="modal">
        <div class="modal-content">
            <h2 id="yes-message">I knew you'd say yes! 💕</h2>
            
            <!-- Koala character with "you" text -->
            <div id="koala-container">
                <img id="koala-img" src="https://i.imgur.com/7QeQx9l.png" alt="overwhelmed koala" class="koala">
                <div id="koala-text">you</div>
            </div>
            
            <!-- Pink Envelope -->
            <div id="envelope-container">
                <div id="envelope">
                    <div class="envelope-flap"></div>
                    <div class="envelope-body"></div>
                    <div class="envelope-seal">💌</div>
                </div>
            </div>
            
            <!-- Hearts spill container -->
            <div id="hearts-spill-container"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
